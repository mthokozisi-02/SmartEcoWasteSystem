<div *ngIf="isLoading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.6); display: flex; align-items: center; justify-content: center; z-index: 9999">
    <p-progressSpinner></p-progressSpinner>
</div>
<p-toast></p-toast>
<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="createUser()" />
    </ng-template>
</p-toolbar>

<p-table
    #dt
    [value]="users()"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['name']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 20, 30]"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th style="width: 3rem">ID</th>
            <th style="min-width: 8rem">Name</th>
            <th pSortableColumn="name" style="min-width: 8rem">Email</th>
            <th pSortableColumn="price" style="min-width: 6rem">Role</th>
            <th pSortableColumn="category" style="min-width: 6rem">Created At</th>
            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-user>
        <tr>
            <td style="width: 3rem">{{user.id}}</td>
            <td style="min-width: 8rem">{{ user.name }}</td>
            <td style="min-width: 8rem">{{ user.email }}</td>
            <td style="min-width: 6rem">{{ user.roleName }}</td>
            <td style="min-width: 6rem">{{ user.createdAt | date: 'yyyy-MM-dd HH:mm' }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="ngOnInit()" />
                <p-button icon="pi pi-trash" severity="danger" class="mr-2" [rounded]="true" [outlined]="true" (click)="ngOnInit()" />
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="createUserDialog" [style]="{ width: '450px' }" header="User Details" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">
            <div>
                <label for="name" class="block font-bold mb-3">Name</label>
                <input type="text" pInputText id="name" [(ngModel)]="newUser.name" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !newUser.name">Name is required.</small>
            </div>
            <div>
                <label for="email" class="block font-bold mb-3">Email</label>
                <input type="text" pInputText id="email" [(ngModel)]="newUser.email" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !newUser.email">Email is required.</small>
            </div>
            <div>
                <label for="password" class="block font-bold mb-3">Password</label>
                <input type="text" pInputText id="password" [(ngModel)]="newUser.passwordHash" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !newUser.passwordHash">Password is required.</small>
            </div>
        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" severity="danger" text (click)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" (click)="saveUser()" />
    </ng-template>
</p-dialog>
