<div *ngIf="isLoading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.6); display: flex; align-items: center; justify-content: center; z-index: 9999">
    <p-progressSpinner></p-progressSpinner>
</div>
<p-toast></p-toast>
<div class="card flex flex-col gap-4">
    <div class="grid grid-cols-12 gap-4 grid-nogutter">
        <div class="col-span-12">
            <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                <div class="md:w-40 relative">
                    <img class="block xl:block mx-auto rounded-border w-full" src="/src/assets/profile.jpg" alt="image" />
                </div>
                <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
                    <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                        <div>
                            <span class="font-medium text-secondary text-sm">{{ user.email }}</span>
                            <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">{{ user.name }}</div>
                        </div>
                        <div class="bg-surface-100 dark:bg-surface-700 p-1" style="border-radius: 30px">
                            <div
                                class="bg-surface-0 dark:bg-surface-900 flex items-center gap-2 justify-center py-1 px-2"
                                style="
                                    border-radius: 30px;
                                    box-shadow:
                                        0px 1px 2px 0px rgba(0, 0, 0, 0.04),
                                        0px 1px 2px 0px rgba(0, 0, 0, 0.06);
                                "
                            >
                                <span class="text-surface-900 dark:text-surface-0 font-medium text-sm">{{ user.reports }} Reports</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col md:items-end gap-8">
                        <p-badge [value]="user.points" [severity]="userSeverity(user.points)" class="text-xl font-semibold text-surface-900 dark:text-surface-0" />
                        <div class="flex flex-row-reverse md:flex-row gap-2">
                            <p-button icon="pi pi-pencil" class="flex-auto md:flex-initial whitespace-nowrap" label="Change Password" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
